name: Metrics

on:
  # Weekly schedule — every Monday at 03:00 UTC
  schedule:
    - cron: "0 3 * * 1"
  # Also run on every push to main
  push:
    branches:
      - main
  # Allow manual triggers from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update github-metrics.svg"
          config_timezone: Asia/Kolkata
          user: ramangosal7
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large