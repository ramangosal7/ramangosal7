name: Update streak stats

on:
  # Daily at 03:00 UTC
  schedule:
    - cron: "0 3 * * *"
  # Re-run when this workflow file changes
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  # Allow manual triggers from the Actions tab
  workflow_dispatch:

jobs:
  streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=ramangosal7&theme=radical&disable_animations=true&timezone=Asia/Kolkata"
          path: profile/streak.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats [skip ci]" || exit 0
          git push
