name: Update top languages

on:
  # Weekly — every Monday at 03:30 UTC (staggered after metrics/streak)
  schedule:
    - cron: "30 3 * * 1"
  # Re-run when this workflow file changes
  push:
    paths:
      - ".github/workflows/top-langs.yml"
  # Allow manual triggers from the Actions tab
  workflow_dispatch:

jobs:
  top-langs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install card core (same version the action pins)
        run: npm install --no-save --ignore-scripts @stats-organization/github-readme-stats-core@2.2.0

      # The action only wires a single token (PAT_1), so its retryer throws
      # MAX_RETRY as soon as that token is rate-limited. Our generator loads the
      # same core but exposes the full PAT_* rotation (PAT_1 = METRICS_TOKEN,
      # PAT_2 = GITHUB_TOKEN) so a rate-limited token is rotated instead of
      # failing. Retry with backoff to ride out a transient rate-limit window.
      - name: Generate top languages (compact text)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 6
          retry_wait_seconds: 30
          retry_on: error
          shell: bash
          command: |
            node .github/scripts/generate_top_langs.mjs
        env:
          OUTPUT_PATH: images/top-langs.svg
          CARD_OPTIONS: "username=ramangosal7&layout=compact&theme=radical&langs_count=8&card_width=495&disable_animations=true&hide_progress=true"
          PAT_1: ${{ secrets.METRICS_TOKEN }}
          PAT_2: ${{ github.token }}

      - name: Reflow legend to 4 columns x 2 rows
        run: python3 .github/scripts/reflow_top_langs.py images/top-langs.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/top-langs.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update top-langs [skip ci]"
          # Rebase onto any commits other workflows pushed while we ran, then push
          git pull --rebase --autostash origin main
          git push || {
            git pull --rebase --autostash origin main
            git push
          }
