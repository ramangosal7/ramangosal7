name: Update top languages

on:
  # Weekly — every Monday at 03:30 UTC (staggered after metrics/streak)
  schedule:
    - cron: "30 3 * * 1"
  # Re-run when this workflow file changes
  push:
    paths:
      - ".github/workflows/top-langs.yml"
  # Allow manual triggers from the Actions tab
  workflow_dispatch:

jobs:
  top-langs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate top languages (compact text)
        uses: readme-tools/github-readme-stats-action@main
        with:
          card: top-langs
          options: "username=ramangosal7&layout=compact&theme=radical&langs_count=8&card_width=495&disable_animations=true&hide_progress=true"
          path: images/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: "true"

      - name: Reflow legend to 4 columns x 2 rows
        run: python3 .github/scripts/reflow_top_langs.py images/top-langs.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/top-langs.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update top-langs [skip ci]"
          # Rebase onto any commits other workflows pushed while we ran, then push
          git pull --rebase --autostash origin main
          git push || {
            git pull --rebase --autostash origin main
            git push
          }
